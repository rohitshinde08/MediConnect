<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - Doctor Portal - MediConnect</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="dashboard-sidebar" id="doctorSidebar">
            <div class="sidebar-logo"><div class="logo-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></div><span class="logo-text">Medi<span style="color:var(--primary-300);">Connect</span></span></div>
            <nav class="sidebar-nav">
                <div class="sidebar-section-title">Main</div>
                <a href="/index.html" class="sidebar-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>Back to Home</a>
                <a href="/doctor/dashboard.html" class="sidebar-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Dashboard</a>
                <div class="sidebar-section-title">Appointments</div>
                <a href="/doctor/new-appointments.html" class="sidebar-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>New Appointments</a>
                <a href="/doctor/approved-appointments.html" class="sidebar-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>Approved</a>
                <a href="/doctor/cancelled-appointments.html" class="sidebar-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>Cancelled</a>
                <a href="/doctor/all-appointments.html" class="sidebar-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>All Appointments</a>
                <div class="sidebar-section-title">Account</div>
                <a href="/doctor/profile.html" class="sidebar-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>My Profile</a>
                <a href="#" class="sidebar-link" onclick="logout()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                    Logout
                </a>
            </nav>
        </aside>

        <main class="dashboard-main">
            <button class="sidebar-toggle-btn" onclick="document.getElementById('doctorSidebar').classList.toggle('open')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>

            <div class="dashboard-header"><div><h1 class="dashboard-title">Search Appointments</h1><p class="dashboard-subtitle">Search your appointments by patient name, number, or phone.</p></div></div>

            <!-- Search Box -->
            <div style="margin-bottom: var(--space-8);">
                <div class="search-box" style="max-width: 100%;">
                    <div class="search-input-wrapper">
                        <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        <input type="text" class="search-input" id="searchInput" placeholder="Search by name, number, or phone...">
                    </div>
                    <button class="search-btn" onclick="searchAppointments()">SEARCH</button>
                </div>
            </div>

            <div id="searchResults"></div>
        </main>
    </div>

    <script src="/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!requireAuth('doctor')) return;
            initDashboardSidebar();
        });

        document.getElementById('searchInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') searchAppointments(); });

        async function searchAppointments() {
            const query = document.getElementById('searchInput').value.trim();
            const resultsDiv = document.getElementById('searchResults');
            if (!query) { showToast('Enter a search term', 'warning'); return; }

            resultsDiv.innerHTML = `<div class="loading-overlay"><div class="spinner"></div></div>`;

            try {
                const data = await apiGet(`/appointments/search?q=${encodeURIComponent(query)}`);
                const user = getUser();
                // Filter to only this doctor's appointments
                const myAppointments = (data.appointments || []).filter(a => a.doctor_id === user.id);

                if (myAppointments.length === 0) {
                    resultsDiv.innerHTML = `<div class="empty-state"><h3>No results found</h3><p>Try a different search term.</p></div>`;
                    return;
                }

                resultsDiv.innerHTML = `
                    <div class="table-container">
                        <div style="overflow-x:auto;">
                            <table class="data-table">
                                <thead><tr><th>Apt. No.</th><th>Patient</th><th>Email</th><th>Phone</th><th>Date</th><th>Time</th><th>Status</th></tr></thead>
                                <tbody>
                                    ${myAppointments.map(apt => `<tr>
                                        <td><strong>${apt.appointment_number}</strong></td>
                                        <td>${apt.patient_name}</td>
                                        <td>${apt.patient_email}</td>
                                        <td>${apt.patient_phone}</td>
                                        <td>${formatDate(apt.appointment_date)}</td>
                                        <td>${apt.time_slot}</td>
                                        <td>${getStatusBadge(apt.status)}</td>
                                    </tr>`).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            } catch (error) { showToast('Search failed', 'error'); }
        }
    </script>
</body>
</html>
