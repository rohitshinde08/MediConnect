<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Registration - MediConnect</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <div class="page-wrapper">
        <div class="container" style="max-width: 800px;">
            <div class="page-header">
                <div class="badge">Join Our Network</div>
                <h1>Doctor Registration</h1>
                <p>Register as a healthcare professional and start managing your appointments.</p>
            </div>

            <div class="form-container">
                <!-- Step 1: Doctor Details -->
                <form id="doctorRegisterForm" enctype="multipart/form-data">
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">Full Name <span class="required">*</span></label>
                            <input type="text" class="form-input" id="regFullName" name="full_name" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Email Address <span class="required">*</span></label>
                            <input type="email" class="form-input" id="regEmail" name="email" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Password <span class="required">*</span></label>
                            <input type="password" class="form-input" id="regPassword" name="password" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Specialization <span class="required">*</span></label>
                            <select class="form-select" id="regSpecialization" name="specialization_id" required>
                                <option value="">Select specialization</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label">License Number <span class="required">*</span></label>
                            <input type="text" class="form-input" id="regLicense" name="license_number" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Qualification</label>
                            <input type="text" class="form-input" id="regQualification" name="qualification" placeholder="e.g. MBBS, MD">
                        </div>

                        <div class="form-group">
                            <label class="form-label">Experience (Years)</label>
                            <input type="number" class="form-input" id="regExperience" name="experience_years" value="0" min="0">
                        </div>

                        <div class="form-group">
                            <label class="form-label">Phone Number <span class="required">*</span></label>
                            <input type="tel" class="form-input" id="regPhone" name="phone" placeholder="+91 9876543210" pattern="^(\+91[\-\s]?)?[0-9]{10}$" title="Please enter a valid 10-digit Indian phone number, optionally starting with +91" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Consultation Fee (₹) <span class="required">*</span></label>
                            <input type="number" class="form-input" id="regFee" name="consultation_fee" placeholder="e.g. 500" min="0" step="0.01" required>
                        </div>

                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label class="form-label">Bio / About</label>
                            <textarea class="form-input" id="regBio" name="bio" rows="3" placeholder="Brief professional summary..." style="resize: vertical;"></textarea>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Upload License/Degree <span class="required">*</span></label>
                            <input type="file" class="form-input" id="regDocument" name="document" accept=".pdf,.jpg,.png" required>
                        </div>
                    </div>

                    <div style="margin-top: var(--space-8);">
                        <button type="submit" class="btn btn-primary btn-block" id="sendOtpBtn">Send Verification Code</button>
                    </div>
                </form>

                <!-- Step 2: OTP Verification -->
                <div id="otpSection" class="hidden" style="margin-top: var(--space-4);">
                    <div style="text-align: center; margin-bottom: var(--space-6);">
                        <div style="background: var(--primary-50); color: var(--primary-700); padding: var(--space-4); border-radius: var(--radius-md); font-size: 14px;">
                            We've sent a 6-digit verification code to your email.
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" style="text-align: center; display: block;">Enter Verification Code</label>
                        <input type="text" class="form-input" id="regOtp" placeholder="123456" maxlength="6" pattern="\d{6}" 
                               style="text-align: center; font-size: 24px; letter-spacing: 8px; font-weight: 700;">
                    </div>

                    <div style="margin-top: var(--space-8);">
                        <button type="button" class="btn btn-primary btn-block" id="verifyBtn">Verify & Submit Application</button>
                        <button type="button" class="btn btn-block" id="backBtn" style="margin-top: var(--space-3); border: 1px solid var(--gray-200);">Back</button>
                    </div>
                </div>

                <div style="margin-top: var(--space-6); text-align: center;">
                    Already have an account? <a href="/doctor/login.html" style="color: var(--primary-600); font-weight: 600;">Login here</a>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>
    <script src="/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const specSelect = document.getElementById('regSpecialization');
            const form = document.getElementById('doctorRegisterForm');
            const otpSection = document.getElementById('otpSection');
            const sendOtpBtn = document.getElementById('sendOtpBtn');
            const verifyBtn = document.getElementById('verifyBtn');
            const backBtn = document.getElementById('backBtn');

            // Load specializations
            try {
                const data = await apiGet('/specializations');
                data.specializations.forEach(s => {
                    specSelect.innerHTML += `<option value="${s.id}">${s.name}</option>`;
                });
            } catch (e) {}

            // Step 1: Send OTP
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('regEmail').value.trim();
                
                sendOtpBtn.disabled = true;
                sendOtpBtn.textContent = 'Sending code...';

                try {
                    await apiPost('/auth/doctor/register-request', { email });
                    form.classList.add('hidden');
                    otpSection.classList.remove('hidden');
                    showToast('Verification code sent!', 'success');
                } catch (error) {
                    showToast(error.message, 'error');
                    sendOtpBtn.disabled = false;
                    sendOtpBtn.textContent = 'Send Verification Code';
                }
            });

            // Step 2: Final Registration
            verifyBtn.addEventListener('click', async () => {
                const otp = document.getElementById('regOtp').value.trim();
                if (!otp) return showToast('Please enter the OTP', 'warning');

                const formData = new FormData(form);
                formData.append('otp', otp);

                verifyBtn.disabled = true;
                verifyBtn.textContent = 'Submitting...';

                try {
                    const response = await fetch('/api/auth/doctor/register', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await response.json();
                    
                    if (!response.ok) throw new Error(data.error || 'Registration failed');
                    
                    showToast('Registration successful! Waiting for approval.', 'success');
                    setTimeout(() => window.location.href = '/doctor/login.html', 2000);
                } catch (error) {
                    showToast(error.message, 'error');
                    verifyBtn.disabled = false;
                    verifyBtn.textContent = 'Verify & Submit Application';
                }
            });

            backBtn.addEventListener('click', () => {
                otpSection.classList.add('hidden');
                form.classList.remove('hidden');
                sendOtpBtn.disabled = false;
                sendOtpBtn.textContent = 'Send Verification Code';
            });
        });
    </script>
</body>
</html>
