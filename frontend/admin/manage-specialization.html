<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Specializations - Admin - MediConnect</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="dashboard-sidebar" id="adminSidebar">
            <div class="sidebar-logo"><div class="logo-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></div><span class="logo-text">Medi<span style="color:var(--primary-300);">Connect</span></span></div>
            <nav class="sidebar-nav">
                <div class="sidebar-section-title">Main</div>
                <a href="/index.html" class="sidebar-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>Back to Home</a>
                <a href="/admin/dashboard.html" class="sidebar-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Dashboard</a>
                <div class="sidebar-section-title">Management</div>
                <a href="/admin/manage-doctors.html" class="sidebar-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Manage Doctors</a>
                <a href="/admin/manage-specialization.html" class="sidebar-link active"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>Specializations</a>
                <a href="/admin/manage-appointments.html" class="sidebar-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Appointments</a>
                <div class="sidebar-section-title">Account</div>
                <a href="#" class="sidebar-link" onclick="logout()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                    Logout
                </a>
            </nav>
        </aside>

        <main class="dashboard-main">
            <button class="sidebar-toggle-btn" onclick="document.getElementById('adminSidebar').classList.toggle('open')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>

            <div class="dashboard-header">
                <div><h1 class="dashboard-title">Manage Specializations</h1><p class="dashboard-subtitle">Add and manage medical specializations.</p></div>
            </div>

            <!-- Add Specialization -->
            <div class="form-container" style="margin-bottom: var(--space-8); max-width: 100%;">
                <h3 style="margin-bottom: var(--space-5);">Add New Specialization</h3>
                <form id="addSpecForm" style="display: flex; gap: var(--space-4); flex-wrap: wrap; align-items: flex-end;">
                    <div class="form-group" style="flex: 1; min-width: 200px;">
                        <label class="form-label">Name <span class="required">*</span></label>
                        <input type="text" class="form-input" id="specName" placeholder="e.g. Cardiology" required>
                    </div>
                    <div class="form-group" style="flex: 2; min-width: 200px;">
                        <label class="form-label">Description</label>
                        <input type="text" class="form-input" id="specDesc" placeholder="Brief description">
                    </div>
                    <button type="submit" class="btn btn-primary">Add</button>
                </form>
            </div>

            <!-- Specializations Table -->
            <div class="table-container">
                <div class="table-header"><h3 class="table-title">All Specializations</h3></div>
                <div style="overflow-x:auto;">
                    <table class="data-table">
                        <thead><tr><th>ID</th><th>Name</th><th>Description</th><th>Actions</th></tr></thead>
                        <tbody id="specList"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!requireAuth('admin')) return;
            initDashboardSidebar();
            loadSpecializations();
        });

        async function loadSpecializations() {
            try {
                const data = await apiGet('/specializations');
                const tbody = document.getElementById('specList');
                const specs = data.specializations || [];

                if (specs.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="text-center" style="padding:var(--space-8);color:var(--neutral-400);">No specializations found</td></tr>`;
                    return;
                }

                tbody.innerHTML = specs.map(s => `
                    <tr>
                        <td>${s.id}</td>
                        <td><strong>${s.name}</strong></td>
                        <td>${s.description || '—'}</td>
                        <td>
                            <div class="table-actions">
                                <button class="action-btn cancel" title="Delete" onclick="deleteSpec(${s.id})">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                                </button>
                            </div>
                        </td>
                    </tr>
                `).join('');
            } catch (error) { showToast('Failed to load specializations', 'error'); }
        }

        // Add Specialization
        document.getElementById('addSpecForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await apiPost('/specializations', {
                    name: document.getElementById('specName').value.trim(),
                    description: document.getElementById('specDesc').value.trim()
                });
                showToast('Specialization added!', 'success');
                document.getElementById('addSpecForm').reset();
                loadSpecializations();
            } catch (error) { showToast(error.message || 'Failed to add specialization', 'error'); }
        });

        async function deleteSpec(id) {
            if (!confirm('Delete this specialization?')) return;
            try {
                await apiDelete(`/specializations/${id}`);
                showToast('Specialization deleted!', 'success');
                loadSpecializations();
            } catch (error) { showToast('Failed to delete', 'error'); }
        }
    </script>
</body>
</html>
