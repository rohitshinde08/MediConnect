<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Doctors - Admin - MediConnect</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="dashboard-sidebar" id="adminSidebar">
            <div class="sidebar-logo"><div class="logo-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></div><span class="logo-text">Medi<span style="color:var(--primary-300);">Connect</span></span></div>
            <nav class="sidebar-nav">
                <div class="sidebar-section-title">Main</div>
                <a href="/index.html" class="sidebar-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>Back to Home</a>
                <a href="/admin/dashboard.html" class="sidebar-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Dashboard</a>
                <div class="sidebar-section-title">Management</div>
                <a href="/admin/manage-doctors.html" class="sidebar-link active"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Manage Doctors</a>
                <a href="/admin/manage-specialization.html" class="sidebar-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>Specializations</a>
                <a href="/admin/manage-appointments.html" class="sidebar-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Appointments</a>
                <div class="sidebar-section-title">Account</div>
                <a href="#" class="sidebar-link" onclick="logout()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                    Logout
                </a>
            </nav>
        </aside>

        <main class="dashboard-main">
            <button class="sidebar-toggle-btn" onclick="document.getElementById('adminSidebar').classList.toggle('open')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>

            <div class="dashboard-header">
                <div><h1 class="dashboard-title">Manage Doctors</h1><p class="dashboard-subtitle">View and manage doctor account statuses.</p></div>
                <button class="btn btn-primary" onclick="openAddModal()">Add Doctor</button>
            </div>

            <!-- Doctors Table -->
            <div class="table-container">
                <div class="table-header"><h3 class="table-title">All Doctors</h3><div class="table-filters"><input type="text" class="filter-input" id="searchDoctors" placeholder="Search doctors..." oninput="filterDoctors()"></div></div>
                <div style="overflow-x:auto;">
                    <table class="data-table">
                        <thead><tr><th>Name</th><th>Email</th><th>Specialization</th><th>Phone</th><th>License</th><th>Status</th><th>Actions</th></tr></thead>
                        <tbody id="doctorsList"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Doctor Modal -->
    <div id="addDoctorModal" class="modal">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header">
                <h3 class="modal-title">Add New Doctor</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="addDoctorForm" style="padding: var(--space-6);">
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-input" id="addFullName" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-input" id="addEmail" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-input" id="addPassword" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Specialization</label>
                        <select class="form-select" id="addSpecialization" required>
                            <option value="">Select</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">License Number</label>
                        <input type="text" class="form-input" id="addLicense" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Phone</label>
                        <input type="tel" class="form-input" id="addPhone" placeholder="+91 9876543210" pattern="^(\+91[\-\s]?)?[0-9]{10}$" title="Please enter a valid 10-digit Indian phone number, optionally starting with +91">
                    </div>
                </div>
                <div style="margin-top: var(--space-6); display: flex; gap: var(--space-3); justify-content: flex-end;">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Doctor</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/script.js"></script>
    <script>
        let allDoctors = [];

        document.addEventListener('DOMContentLoaded', () => {
            if (!requireAuth('admin')) return;
            initDashboardSidebar();
            loadDoctors();
            loadSpecializations();

            document.getElementById('addDoctorForm').addEventListener('submit', handleAddDoctor);
        });

        async function loadSpecializations() {
            try {
                const data = await apiGet('/specializations');
                const select = document.getElementById('addSpecialization');
                data.specializations.forEach(s => {
                    select.innerHTML += `<option value="${s.id}">${s.name}</option>`;
                });
            } catch (e) {}
        }

        function openAddModal() {
            document.getElementById('addDoctorModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('addDoctorModal').style.display = 'none';
            document.getElementById('addDoctorForm').reset();
        }

        async function handleAddDoctor(e) {
            e.preventDefault();
            const payload = {
                full_name: document.getElementById('addFullName').value,
                email: document.getElementById('addEmail').value,
                password: document.getElementById('addPassword').value,
                specialization_id: parseInt(document.getElementById('addSpecialization').value),
                license_number: document.getElementById('addLicense').value,
                phone: document.getElementById('addPhone').value
            };

            try {
                await apiPost('/admin/doctors', payload);
                showToast('Doctor added and approved!', 'success');
                closeModal();
                loadDoctors();
            } catch (error) { showToast(error.message, 'error'); }
        }

        async function loadDoctors() {
            try {
                const data = await apiGet('/doctors');
                allDoctors = data.doctors || [];
                renderDoctors(allDoctors);
            } catch (error) { showToast('Failed to load doctors', 'error'); }
        }

        function renderDoctors(doctors) {
            const tbody = document.getElementById('doctorsList');
            if (doctors.length === 0) { tbody.innerHTML = `<tr><td colspan="7" class="text-center" style="padding:var(--space-8);color:var(--neutral-400);">No doctors found</td></tr>`; return; }
            tbody.innerHTML = doctors.map(doc => `
                <tr>
                    <td><strong>${doc.full_name}</strong></td>
                    <td>${doc.email}</td>
                    <td>${doc.specialization_name || 'N/A'}</td>
                    <td>${doc.phone || 'N/A'}</td>
                    <td>${doc.license_number || 'N/A'}</td>
                    <td>${getStatusBadge(doc.status === 'active' ? 'approved' : 'cancelled')}</td>
                    <td>
                        <div class="table-actions">
                            <button class="action-btn ${doc.status === 'active' ? 'cancel' : 'approve'}" title="${doc.status === 'active' ? 'Deactivate' : 'Activate'}" onclick="toggleDoctorStatus(${doc.id}, '${doc.status === 'active' ? 'inactive' : 'active'}')">
                                ${doc.status === 'active' ? 
                                    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>' :
                                    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>'
                                }
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function filterDoctors() {
            const q = document.getElementById('searchDoctors').value.toLowerCase();
            renderDoctors(allDoctors.filter(d => d.full_name.toLowerCase().includes(q) || d.email.toLowerCase().includes(q)));
        }

        async function toggleDoctorStatus(id, status) {
            try {
                await apiPut(`/admin/doctors/${id}/status`, { status });
                showToast(`Doctor ${status === 'active' ? 'activated' : 'deactivated'}!`, 'success');
                loadDoctors();
            } catch (error) { showToast('Failed to update status', 'error'); }
        }

        async function deleteDoctor(id) {
            if (!confirm('Are you sure you want to delete this doctor? This action cannot be undone.')) return;
            try {
                await apiDelete(`/doctors/${id}`);
                showToast('Doctor deleted!', 'success');
                loadDoctors();
            } catch (error) { showToast('Failed to delete doctor', 'error'); }
        }
    </script>
</body>
</html>
