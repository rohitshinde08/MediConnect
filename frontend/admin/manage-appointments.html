<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Appointments - Admin - MediConnect</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="dashboard-sidebar" id="adminSidebar">
            <div class="sidebar-logo"><div class="logo-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></div><span class="logo-text">Medi<span style="color:var(--primary-300);">Connect</span></span></div>
            <nav class="sidebar-nav">
                <div class="sidebar-section-title">Main</div>
                <a href="/index.html" class="sidebar-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>Back to Home</a>
                <a href="/admin/dashboard.html" class="sidebar-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Dashboard</a>
                <div class="sidebar-section-title">Management</div>
                <a href="/admin/manage-doctors.html" class="sidebar-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Manage Doctors</a>
                <a href="/admin/manage-specialization.html" class="sidebar-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>Specializations</a>
                <a href="/admin/manage-appointments.html" class="sidebar-link active"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Appointments</a>
                <div class="sidebar-section-title">Account</div>
                <a href="#" class="sidebar-link" onclick="logout()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                    Logout
                </a>
            </nav>
        </aside>

        <main class="dashboard-main">
            <button class="sidebar-toggle-btn" onclick="document.getElementById('adminSidebar').classList.toggle('open')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>

            <div class="dashboard-header">
                <div><h1 class="dashboard-title">Manage Appointments</h1><p class="dashboard-subtitle">View and manage all appointments across the platform.</p></div>
            </div>

            <!-- Status Filter Tabs -->
            <div style="display: flex; gap: var(--space-2); margin-bottom: var(--space-6); flex-wrap: wrap;">
                <button class="btn btn-sm btn-primary" id="filterAll" onclick="filterByStatus('')">All</button>
                <button class="btn btn-sm btn-secondary" id="filterPending" onclick="filterByStatus('pending')">Pending</button>
                <button class="btn btn-sm btn-secondary" id="filterApproved" onclick="filterByStatus('approved')">Approved</button>
                <button class="btn btn-sm btn-secondary" id="filterCancelled" onclick="filterByStatus('cancelled')">Cancelled</button>
            </div>

            <!-- Appointments Table -->
            <div class="table-container">
                <div class="table-header">
                    <h3 class="table-title">All Appointments</h3>
                    <div class="table-filters"><input type="text" class="filter-input" id="searchFilter" placeholder="Search..." oninput="filterTable()"></div>
                </div>
                <div style="overflow-x:auto;">
                    <table class="data-table">
                        <thead><tr><th>Apt. No.</th><th>Patient</th><th>Doctor</th><th>Specialization</th><th>Date</th><th>Time</th><th>Status</th><th>Actions</th></tr></thead>
                        <tbody id="appointmentsList"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="/script.js"></script>
    <script>
        let allAppointments = [];
        let currentFilter = '';

        document.addEventListener('DOMContentLoaded', () => {
            if (!requireAuth('admin')) return;
            initDashboardSidebar();
            loadAppointments();
        });

        async function loadAppointments() {
            try {
                const data = await apiGet('/appointments');
                allAppointments = data.appointments || [];
                renderTable(allAppointments);
            } catch (error) { showToast('Failed to load appointments', 'error'); }
        }

        function filterByStatus(status) {
            currentFilter = status;
            // Update button styles
            document.querySelectorAll('[id^="filter"]').forEach(btn => {
                btn.className = 'btn btn-sm btn-secondary';
            });
            document.getElementById(status ? `filter${status.charAt(0).toUpperCase() + status.slice(1)}` : 'filterAll').className = 'btn btn-sm btn-primary';

            const filtered = status ? allAppointments.filter(a => a.status === status) : allAppointments;
            renderTable(filtered);
        }

        function filterTable() {
            const q = document.getElementById('searchFilter').value.toLowerCase();
            let filtered = currentFilter ? allAppointments.filter(a => a.status === currentFilter) : allAppointments;
            filtered = filtered.filter(a => 
                a.patient_name.toLowerCase().includes(q) || 
                a.appointment_number.toLowerCase().includes(q) ||
                (a.doctor_name && a.doctor_name.toLowerCase().includes(q))
            );
            renderTable(filtered);
        }

        function renderTable(appointments) {
            const tbody = document.getElementById('appointmentsList');
            if (appointments.length === 0) { 
                tbody.innerHTML = `<tr><td colspan="8" class="text-center" style="padding:var(--space-8);color:var(--neutral-400);">No appointments found</td></tr>`; 
                return; 
            }
            tbody.innerHTML = appointments.map(apt => `
                <tr>
                    <td><strong>${apt.appointment_number}</strong></td>
                    <td>${apt.patient_name}</td>
                    <td>${apt.doctor_name || 'N/A'}</td>
                    <td>${apt.specialization_name || 'N/A'}</td>
                    <td>${formatDate(apt.appointment_date)}</td>
                    <td>${apt.time_slot}</td>
                    <td>${getStatusBadge(apt.status)}</td>
                    <td>
                        <div class="table-actions">
                            <button class="action-btn" title="View Details" onclick="viewDetails(${apt.id})" style="background:var(--neutral-100);color:var(--neutral-700);">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            </button>
                            ${apt.status === 'pending' ? `
                                <button class="action-btn approve" title="Approve" onclick="updateStatus(${apt.id}, 'approved')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg></button>
                                <button class="action-btn cancel" title="Cancel" onclick="updateStatus(${apt.id}, 'cancelled')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
                            ` : ''}
                            <button class="action-btn cancel" title="Delete" onclick="deleteAppointment(${apt.id})"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        async function updateStatus(id, status) {
            if (!confirm(`${status === 'approved' ? 'Approve' : 'Cancel'} this appointment?`)) return;
            try { await apiPut(`/appointments/${id}/status`, { status }); showToast(`Appointment ${status}!`, 'success'); loadAppointments(); }
            catch (error) { showToast('Failed to update', 'error'); }
        }

        async function deleteAppointment(id) {
            if (!confirm('Delete this appointment permanently?')) return;
            try { await apiDelete(`/appointments/${id}`); showToast('Appointment deleted!', 'success'); loadAppointments(); }
            catch (error) { showToast('Failed to delete', 'error'); }
        }
    </script>

    <!-- Appointment Details Modal -->
    <div id="detailsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Appointment Details</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>
</body>
</html>
