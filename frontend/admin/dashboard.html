<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - MediConnect</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="dashboard-layout">
        <!-- Admin Sidebar -->
        <aside class="dashboard-sidebar" id="adminSidebar">
            <div class="sidebar-logo"><div class="logo-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></div><span class="logo-text">Medi<span style="color:var(--primary-300);">Connect</span></span></div>
            <nav class="sidebar-nav">
                <div class="sidebar-section-title">Main</div>
                <a href="/index.html" class="sidebar-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>Back to Home</a>
                <a href="/admin/dashboard.html" class="sidebar-link active"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Dashboard</a>
                <div class="sidebar-section-title">Management</div>
                <a href="/admin/manage-doctors.html" class="sidebar-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Manage Doctors</a>
                <a href="/admin/manage-specialization.html" class="sidebar-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>Specializations</a>
                <a href="/admin/manage-appointments.html" class="sidebar-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Appointments</a>
                <div class="sidebar-section-title">Account</div>
                <a href="#" class="sidebar-link" onclick="logout()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                    Logout
                </a>
            </nav>
        </aside>

        <main class="dashboard-main">
            <button class="sidebar-toggle-btn" onclick="document.getElementById('adminSidebar').classList.toggle('open')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>

            <div class="dashboard-header">
                <div><h1 class="dashboard-title">Admin Dashboard</h1><p class="dashboard-subtitle">Overview of the MediConnect platform.</p></div>
            </div>

            <!-- Stats -->
            <div class="stats-grid" id="adminStats">
                <div class="stat-card"><div class="stat-icon green"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div><div><div class="stat-value" id="statDoctors">0</div><div class="stat-label">Total Doctors</div></div></div>
                <div class="stat-card"><div class="stat-icon blue"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div><div><div class="stat-value" id="statAppointments">0</div><div class="stat-label">Total Appointments</div></div></div>
                <div class="stat-card"><div class="stat-icon orange"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div><div><div class="stat-value" id="statPending">0</div><div class="stat-label">Pending</div></div></div>
                <div class="stat-card"><div class="stat-icon red"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></div><div><div class="stat-value" id="statSpecializations">0</div><div class="stat-label">Specializations</div></div></div>
            </div>

            <!-- Recent Appointments -->
            <div class="table-container">
                <div class="table-header"><h3 class="table-title">Recent Appointments</h3><a href="/admin/manage-appointments.html" class="btn btn-sm btn-secondary">View All</a></div>
                <div style="overflow-x:auto;">
                    <table class="data-table">
                        <thead><tr><th>Apt. No.</th><th>Patient</th><th>Doctor</th><th>Date</th><th>Status</th></tr></thead>
                        <tbody id="recentAppointments"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!requireAuth('admin')) return;
            initDashboardSidebar();
            loadDashboard();
        });

        async function loadDashboard() {
            try {
                const data = await apiGet('/admin/dashboard');
                const s = data.stats;

                document.getElementById('statDoctors').textContent = s.totalDoctors;
                document.getElementById('statAppointments').textContent = s.totalAppointments;
                document.getElementById('statPending').textContent = s.pendingAppointments;
                document.getElementById('statSpecializations').textContent = s.totalSpecializations;

                const tbody = document.getElementById('recentAppointments');
                if (data.recentAppointments && data.recentAppointments.length > 0) {
                    tbody.innerHTML = data.recentAppointments.map(apt => `
                        <tr>
                            <td><strong>${apt.appointment_number}</strong></td>
                            <td>${apt.patient_name}</td>
                            <td>${apt.doctor_name || 'N/A'}</td>
                            <td>${formatDate(apt.appointment_date)}</td>
                            <td>${getStatusBadge(apt.status)}</td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = `<tr><td colspan="5" class="text-center" style="padding:var(--space-8);color:var(--neutral-400);">No appointments yet</td></tr>`;
                }
            } catch (error) {
                showToast('Failed to load dashboard', 'error');
            }
        }
    </script>
</body>
</html>
