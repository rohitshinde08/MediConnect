<!-- ============================================ -->
<!-- MediConnect - Dynamic Header Component       -->
<!-- Included in all pages via JavaScript          -->
<!-- ============================================ -->

<header class="main-header" id="mainHeader">
    <div class="header-container">
        <!-- Logo -->
        <a href="/index.html" class="logo" id="logoLink">
            <div class="logo-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 
                             2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09
                             C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5
                             c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
            </div>
            <span class="logo-text">Medi<span class="logo-highlight">Connect</span></span>
        </a>

        <!-- Navigation -->
        <nav class="main-nav" id="mainNav">
            <a href="/index.html" class="nav-link" data-page="home">Home</a>
            <a href="/patient/appointment.html" class="nav-link" data-page="appointment">Book Appointment</a>
            <a href="/patient/medical-history.html" class="nav-link" data-page="medical-history">Medical History</a>
            <a href="/patient/check-status.html" class="nav-link" data-page="check-status">Check Appointment</a>
        </nav>

        <!-- Right Section -->
        <div class="header-right">
            <!-- Login Dropdown -->
            <div class="login-dropdown" id="loginDropdown">
                <button class="login-btn" id="loginToggle">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <span>Login</span>
                    <svg class="dropdown-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="6 9 12 15 18 9"/>
                    </svg>
                </button>
                <div class="dropdown-menu" id="loginMenu">
                    <a href="/patient/login.html" class="dropdown-item">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        Patient Login
                    </a>
                    <a href="/doctor/login.html" class="dropdown-item">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                        </svg>
                        Doctor Login
                    </a>
                    <a href="/admin/login.html" class="dropdown-item">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="3"/>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4"/>
                        </svg>
                        Admin Login
                    </a>
                </div>
            </div>

            <!-- Notification Bell -->
            <button class="notification-bell" id="notificationBell" title="Notifications">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                </svg>
                <span class="notification-dot"></span>
            </button>

            <!-- Mobile Menu Toggle -->
            <button class="mobile-menu-btn" id="mobileMenuBtn">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>
        </div>
    </div>

    <!-- Mobile Navigation Overlay -->
    <div class="mobile-nav-overlay" id="mobileNavOverlay">
        <div class="mobile-nav-content">
            <a href="/index.html" class="mobile-nav-link" data-page="home">Home</a>
            <a href="/patient/appointment.html" class="mobile-nav-link" data-page="appointment">Book Appointment</a>
            <a href="/patient/check-status.html" class="mobile-nav-link" data-page="check-status">Check Appointment</a>
            <div class="mobile-nav-divider"></div>
            <a href="/patient/login.html" class="mobile-nav-link">Patient Login</a>
            <a href="/doctor/login.html" class="mobile-nav-link">Doctor Login</a>
            <a href="/admin/login.html" class="mobile-nav-link">Admin Login</a>
        </div>
    </div>
</header>
